# Workloads with realistic problems for the MCP agent to investigate.
# Same scenarios as the mock cluster in mcp_server/server.py, but real.
apiVersion: v1
kind: Namespace
metadata:
  name: payments
---
# 1. checkout: uses more memory than its limit -> OOMKilled -> CrashLoopBackOff
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: payments
spec:
  replicas: 1
  selector: {matchLabels: {app: checkout}}
  template:
    metadata: {labels: {app: checkout}}
    spec:
      containers:
        - name: checkout
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - echo "INFO starting checkout service v4.2.0";
              echo "INFO loading price rules into memory cache";
              sleep 3;
              head -c 400m /dev/zero | tail          # holds 400MB in memory
          resources:
            requests: {memory: 64Mi, cpu: 50m}
            limits: {memory: 128Mi}                 # too small -> OOMKilled
---
# 2. ledger: image tag has a typo -> ImagePullBackOff
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger
  namespace: payments
spec:
  replicas: 1
  selector: {matchLabels: {app: ledger}}
  template:
    metadata: {labels: {app: ledger}}
    spec:
      containers:
        - name: ledger
          image: busybox:1.36-typo
          command: ["sleep", "3600"]
---
# 3. search: healthy, writes a log line every few seconds
apiVersion: apps/v1
kind: Deployment
metadata:
  name: search
  namespace: payments
spec:
  replicas: 1
  selector: {matchLabels: {app: search}}
  template:
    metadata: {labels: {app: search}}
    spec:
      containers:
        - name: search
          image: busybox:1.36
          command: ["sh", "-c", "while true; do echo \"INFO request completed status=200 duration_ms=$((RANDOM % 120))\"; sleep 5; done"]
          resources:
            requests: {memory: 16Mi, cpu: 10m}
---
# 4. ingest: asks for more CPU than any node has -> Pending (FailedScheduling)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest
  namespace: payments
spec:
  replicas: 1
  selector: {matchLabels: {app: ingest}}
  template:
    metadata: {labels: {app: ingest}}
    spec:
      containers:
        - name: ingest
          image: busybox:1.36
          command: ["sleep", "3600"]
          resources:
            requests: {cpu: "64"}
